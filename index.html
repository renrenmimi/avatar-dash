<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Avatar Dash — a tiny platformer</title>
<meta name="description" content="A small single-file platformer. Run, jump, stomp, collect, reach the flag." />
<style>
  :root{
    --bg:#0a0d14; --bg2:#0c1018; --ink:#eceef3; --dim:#a7afc0; --faint:#7c869a;
    --accent:#4fd6c0; --accent2:#8b93ff; --danger:#ff6b6b; --gold:#ffd166;
    --line:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 700px at 50% -10%, #131a27 0%, var(--bg) 60%);
    color:var(--ink); font:14px/1.5 ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:16px; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none;
  }
  header{text-align:center}
  h1{margin:0 0 4px; font-size:clamp(18px,3.2vw,24px); letter-spacing:.02em; font-weight:600}
  h1 b{color:var(--accent)}
  .sub{margin:0; color:var(--faint); font-size:12px}
  .wrap{position:relative; width:min(960px,100%); border:1px solid var(--line); border-radius:14px; overflow:hidden;
        background:var(--bg2); box-shadow:0 24px 60px rgba(0,0,0,.45)}
  canvas{display:block; width:100%; height:auto; image-rendering:pixelated}
  .hud{position:absolute; inset:10px 12px auto; display:flex; gap:16px; align-items:center;
       pointer-events:none; font-size:12px; letter-spacing:.04em}
  .hud .pill{background:rgba(10,13,20,.62); border:1px solid var(--line); border-radius:999px;
             padding:5px 11px; backdrop-filter:blur(6px); display:flex; gap:7px; align-items:center}
  .hud .k{color:var(--faint)}
  .hud .v{color:var(--ink); font-variant-numeric:tabular-nums}
  .coin-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(255,209,102,.8)}
  .life-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px rgba(255,107,107,.7)}
  .overlay{position:absolute; inset:0; display:none; place-items:center; text-align:center;
           background:rgba(8,11,17,.82); backdrop-filter:blur(3px); padding:20px}
  .overlay.on{display:grid}
  .card h2{margin:0 0 8px; font-size:clamp(20px,4vw,30px); letter-spacing:.01em}
  .card p{margin:0 0 16px; color:var(--dim); font-size:13px; line-height:1.7}
  .card kbd{background:#171d29; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px;
            padding:2px 7px; color:var(--ink); font:inherit; font-size:12px}
  .btn{appearance:none; cursor:pointer; border:1px solid transparent; border-radius:999px;
       padding:10px 22px; font:inherit; font-size:13px; font-weight:600; letter-spacing:.02em;
       background:var(--accent); color:#04130f; transition:transform .15s ease, filter .15s ease}
  .btn:hover{filter:brightness(1.07); transform:translateY(-1px)}
  .btn.ghost{background:transparent; border-color:var(--line); color:var(--ink)}
  .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .hint{color:var(--faint); font-size:12px; text-align:center; max-width:960px}
  .touch{position:absolute; inset:auto 0 0; display:none; justify-content:space-between; padding:14px; pointer-events:none}
  .touch .side{display:flex; gap:10px; pointer-events:auto}
  .tbtn{width:62px;height:62px;border-radius:50%;background:rgba(20,26,38,.72);border:1px solid var(--line);
        color:var(--ink); font-size:20px; display:grid; place-items:center; backdrop-filter:blur(6px);
        -webkit-tap-highlight-color:transparent}
  .tbtn:active{background:rgba(79,214,192,.22); border-color:var(--accent)}
  @media (pointer:coarse){ .touch{display:flex} }
  footer{color:var(--faint); font-size:11.5px; text-align:center}
  footer a{color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line)}
  footer a:hover{color:var(--accent); border-color:var(--accent)}
</style>
</head>
<body>

<header>
  <h1>Avatar <b>Dash</b></h1>
  <p class="sub">Run · jump · stomp · collect · reach the flag</p>
</header>

<div class="wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <div class="hud">
    <div class="pill"><span class="coin-dot"></span><span class="k">coins</span><span class="v" id="hudCoins">0</span></div>
    <div class="pill"><span class="k">score</span><span class="v" id="hudScore">0</span></div>
    <div class="pill"><span class="k">time</span><span class="v" id="hudTime">0.0</span></div>
    <div class="pill"><span class="life-dot"></span><span class="k">lives</span><span class="v" id="hudLives">3</span></div>
    <div class="pill"><span class="k">jump</span><span class="v" id="hudJump">—</span></div>
  </div>

  <div class="overlay on" id="overlay">
    <div class="card" id="card"></div>
  </div>

  <div class="touch">
    <div class="side">
      <div class="tbtn" data-k="left">◀</div>
      <div class="tbtn" data-k="right">▶</div>
    </div>
    <div class="side">
      <div class="tbtn" data-k="jump">▲</div>
    </div>
  </div>
</div>

<p class="hint">
  <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to move &nbsp;·&nbsp;
  <kbd>Space</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> to jump (hold for higher) &nbsp;·&nbsp;
  <kbd>R</kbd> restart &nbsp;·&nbsp; <kbd>P</kbd> pause
</p>

<footer>
  Single file, no dependencies. Built by <a href="https://github.com/renrenmimi" target="_blank" rel="noopener">Weiren Feng</a>.
  Not affiliated with any existing game franchise.
</footer>

  // ── tuning ────────────────────────────────────────────────────────────────
  const T = 40;                 // tile size
  const GRAVITY = 2400;         // px/s²
  const MOVE = 1500, MAXVX = 340, FRICTION = 1800;
  // Jump. The tallest step in the level is 3 tiles (120px).
  //
  // Every jump starts at JUMP_V, which on its own peaks at ~140px — enough to clear the
  // level even if you only tap. Holding the key applies reduced gravity while rising, so
  // a held jump keeps climbing to ~195px.
  //
  // The earlier approach (scale the velocity down on release) only mattered within ~37ms
  // of takeoff; after that the velocity had already decayed past the clamp on its own, so
  // every press longer than a frame or two produced an identical height.
  const JUMP_V = 730;       // tapped → ~111px (3.3x body height)
  const HOLD_GRAV = 0.63;   // held → ~176px (5.2x body height, matching the genre)
  const JUMP_CUT = 0.45;        // release early → clip the rise
  const COYOTE = 0.10, BUFFER = 0.12;
  const STOMP_BOUNCE = 520;
  const DT = 1 / 120;           // fixed physics step

  // ── level: 1 = solid, C = coin, E = enemy, F = flag, P = player start ─────
  const MAP = [
    "                                                                                            ",
    "                                                                                            ",
    "                                                                                            ",
    "                      C C                                     CCC                           ",
    "                                                                                            ",
    "               C     111111        C C                    1111111        C C C              ",
    "                                                                                          F ",
    "                                                                                            ",
    "        C           E                  E                            E                   111",
    "      1111        11111111        1111111111         111111111111111111111            111   ",
    "  P                                                                                         ",
    "11111111      11111111111      111111       11111111111111        1111111111111111111111    ",
    "11111111      11111111111      111111       11111111111111        1111111111111111111111    ",
  ];
  const COLS = Math.max(...MAP.map(r => r.length)), ROWS = MAP.length;
  const LEVEL_W = COLS * T, LEVEL_H = ROWS * T;

  const solid = [];
  let spawn = { x: 80, y: 80 }, flag = null;
  const coinSeed = [], enemySeed = [];

  MAP.forEach((row, r) => {
    for (let c = 0; c < COLS; c++) {
      const ch = row[c] || " ";
      const x = c * T, y = r * T;
      if (ch === "1") solid.push({ x, y, w: T, h: T });
      else if (ch === "C") coinSeed.push({ x: x + T / 2, y: y + T / 2 });
      else if (ch === "E") enemySeed.push({ x, y });
      else if (ch === "F") flag = { x: x + 6, y: y - T * 2, w: 8, h: T * 3 };
      else if (ch === "P") spawn = { x, y };
    }
  });
  if (!flag) flag = { x: LEVEL_W - 120, y: 200, w: 8, h: T * 3 };

  // ── state ─────────────────────────────────────────────────────────────────
  const player = {
    x: 0, y: 0, w: 34, h: 34, vx: 0, vy: 0,
    onGround: false, face: 1, coyote: 0, buffer: 0, jumpHeld: false, spin: 0, dead: false,
    jumpFromY: 0, peak: 0, lastJump: 0
  };
  let coins = [], enemies = [], particles = [];
  let cam = 0, elapsed = 0, score = 0, got = 0, lives = 3;
  let mode = "title";            // title | play | dead | win | pause
  let shake = 0, flagRaise = 0;

  const $ = id => document.getElementById(id);
  const hud = { c: $("hudCoins"), s: $("hudScore"), t: $("hudTime"), l: $("hudLives"), j: $("hudJump") };
  const overlay = $("overlay"), card = $("card");

  function reset(full) {
    player.x = spawn.x; player.y = spawn.y;
    player.vx = player.vy = 0; player.onGround = false; player.dead = false; player.spin = 0;
    coins = coinSeed.map(c => ({ ...c, got: false, t: Math.random() * 6.28 }));
    enemies = enemySeed.map(e => ({
      x: e.x, y: e.y + T - 30, w: 30, h: 30, vx: 62 * (Math.random() < .5 ? -1 : 1), alive: true, squash: 0
    }));
    particles = []; cam = 0; flagRaise = 0;
    if (full) { elapsed = 0; score = 0; got = 0; lives = 3; }
  }

  // ── input ─────────────────────────────────────────────────────────────────
  const keys = Object.create(null);
  const CODE = {
    ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
    Space: "jump", KeyW: "jump", ArrowUp: "jump"
  };
  addEventListener("keydown", e => {
    const k = CODE[e.code];
    if (k) { e.preventDefault(); if (!keys[k]) if (k === "jump") player.buffer = BUFFER; keys[k] = true; }
    if (e.code === "KeyR") { e.preventDefault(); start(true); }
    if (e.code === "KeyP") { e.preventDefault(); if (mode === "play") pause(); else if (mode === "pause") resume(); }
    if (e.code === "Enter" && (mode === "title" || mode === "win" || mode === "dead")) start(true);
  }, { passive: false });
  addEventListener("keyup", e => { const k = CODE[e.code]; if (k) { e.preventDefault(); keys[k] = false; } }, { passive: false });

  document.querySelectorAll(".tbtn").forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); if (k === "jump") player.buffer = BUFFER; keys[k] = true; };
    const off = e => { e.preventDefault(); keys[k] = false; };
    b.addEventListener("touchstart", on, { passive: false });
    b.addEventListener("touchend", off, { passive: false });
    b.addEventListener("touchcancel", off, { passive: false });
    b.addEventListener("mousedown", on); b.addEventListener("mouseup", off); b.addEventListener("mouseleave", off);
  });

  // ── collision ─────────────────────────────────────────────────────────────
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function moveAxis(ent, dx, dy) {
    ent.x += dx;
    for (const s of solid) {
      if (!hit(ent, s)) continue;
      if (dx > 0) ent.x = s.x - ent.w; else if (dx < 0) ent.x = s.x + s.w;
      ent.vx = 0;
    }
    ent.y += dy;
    ent.onGround = false;
    for (const s of solid) {
      if (!hit(ent, s)) continue;
      if (dy > 0) { ent.y = s.y - ent.h; ent.vy = 0; ent.onGround = true; }
      else if (dy < 0) { ent.y = s.y + s.h; ent.vy = 0; }
    }
  }

  // ── update ────────────────────────────────────────────────────────────────
  function step(dt) {
    if (mode !== "play") return;
    elapsed += dt;

    // horizontal
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) { player.vx += dir * MOVE * dt; player.face = dir; }
    else {
      const f = FRICTION * dt;
      player.vx = Math.abs(player.vx) <= f ? 0 : player.vx - Math.sign(player.vx) * f;
    }
    player.vx = Math.max(-MAXVX, Math.min(MAXVX, player.vx));

    // jump with coyote time + input buffer
    player.coyote = player.onGround ? COYOTE : Math.max(0, player.coyote - dt);
    player.buffer = Math.max(0, player.buffer - dt);
    if (player.buffer > 0 && player.coyote > 0) {
      player.vy = -JUMP_V; player.onGround = false; player.coyote = 0; player.buffer = 0; player.jumpHeld = true;
      player.jumpFromY = player.y; player.peak = 0;
      puff(player.x + player.w / 2, player.y + player.h, 6, "rgba(255,255,255,.5)");
    }
    // Let go, or start falling, and the assist ends for this jump — pressing again in
    // mid-air must not restart it.
    if (!keys.jump || player.vy >= 0) player.jumpHeld = false;

    const g = player.jumpHeld ? GRAVITY * HOLD_GRAV : GRAVITY;
    player.vy = Math.min(player.vy + g * dt, 1400);
    const wasAir = !player.onGround;
    moveAxis(player, player.vx * dt, player.vy * dt);
    // track how high this jump actually went, so the HUD can show it
    if (player.jumpFromY) {
      player.peak = Math.max(player.peak, player.jumpFromY - player.y);
      if (wasAir && player.onGround) { player.lastJump = player.peak; player.jumpFromY = 0; }
    }
    // keep the player inside the level horizontally — otherwise you can walk off
    // the left edge and out of frame, since the camera clamps but the player did not
    if (player.x < 0) { player.x = 0; player.vx = 0; }
    if (player.x > LEVEL_W - player.w) { player.x = LEVEL_W - player.w; player.vx = 0; }
    if (!player.onGround) player.spin += player.vx * dt * 0.012;

    // enemies
    for (const e of enemies) {
      if (!e.alive) { e.squash = Math.max(0, e.squash - dt * 3); continue; }
      e.x += e.vx * dt;
      let blocked = false, grounded = false;
      for (const s of solid) {
        if (hit(e, s)) { e.x -= e.vx * dt; blocked = true; }
        if (Math.abs((s.y) - (e.y + e.h)) < 2) {
          const foot = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
          if (foot > s.x && foot < s.x + s.w) grounded = true;
        }
      }
      if (blocked || !grounded) e.vx = -e.vx;

      if (hit(player, e)) {
        const fromTop = player.vy > 0 && (player.y + player.h) - e.y < 20;
        if (fromTop) {
          e.alive = false; e.squash = 1; player.vy = -STOMP_BOUNCE;
          score += 150; shake = 7;
          puff(e.x + e.w / 2, e.y, 12, "rgba(255,107,107,.85)");
        } else die();
      }
    }

    // coins
    for (const c of coins) {
      if (c.got) continue;
      c.t += dt * 4;
      if (Math.abs((player.x + player.w / 2) - c.x) < 24 && Math.abs((player.y + player.h / 2) - c.y) < 24) {
        c.got = true; got++; score += 100;
        puff(c.x, c.y, 10, "rgba(255,209,102,.95)");
      }
    }

    // fell off the world
    if (player.y > LEVEL_H + 200) die();

    // flag
    if (hit(player, flag)) { mode = "win"; score += Math.max(0, 3000 - Math.floor(elapsed * 40)); showWin(); }

    // particles
    for (const p of particles) { p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);

    // camera
    const target = Math.max(0, Math.min(player.x - W / 2 + player.w / 2, LEVEL_W - W));
    cam += (target - cam) * Math.min(1, dt * 9);
    if (shake > 0) shake = Math.max(0, shake - dt * 26);

    hud.c.textContent = got;
    hud.s.textContent = score;
    hud.t.textContent = elapsed.toFixed(1);
    hud.l.textContent = lives;
    hud.j.textContent = player.lastJump ? Math.round(player.lastJump) + "px" : "—";
  }

  function puff(x, y, n, color) {
    for (let i = 0; i < n; i++) particles.push({
      x, y, vx: (Math.random() - .5) * 260, vy: -Math.random() * 260, life: .45 + Math.random() * .35, color
    });
  }

  function die() {
    if (player.dead) return;
    player.dead = true; lives--; shake = 12;
    puff(player.x + player.w / 2, player.y + player.h / 2, 18, "rgba(255,107,107,.9)");
    mode = "dead";
    setTimeout(() => { lives > 0 ? (reset(false), mode = "play") : showOver(); }, 700);
  }

  // ── render ────────────────────────────────────────────────────────────────
  function bgLayer(off, color, h0, seed) {
    ctx.fillStyle = color; ctx.beginPath();
    const step = 130;
    for (let x = -step; x <= W + step; x += step) {
      const wx = x + ((-cam * off) % step);
      const n = Math.sin((Math.floor((x - ((-cam * off) - (-cam * off) % step)) / step) + seed) * 12.9898) * 43758.5453;
      const hgt = h0 + (n - Math.floor(n)) * 70;
      ctx.moveTo(wx - step * .7, H); ctx.lineTo(wx, H - hgt); ctx.lineTo(wx + step * .7, H);
    }
    ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#101726"); g.addColorStop(1, "#0a0d14");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    bgLayer(.20, "rgba(79,214,192,.055)", 150, 3);
    bgLayer(.42, "rgba(139,147,255,.075)", 105, 11);

    ctx.save();
    const sx = shake > 0 ? (Math.random() - .5) * shake : 0;
    const sy = shake > 0 ? (Math.random() - .5) * shake : 0;
    ctx.translate(-cam + sx, sy);

    // platforms
    for (const s of solid) {
      if (s.x + s.w < cam - 40 || s.x > cam + W + 40) continue;
      ctx.fillStyle = "#182131";
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = "rgba(79,214,192,.55)";
      ctx.fillRect(s.x, s.y, s.w, 3);
      ctx.fillStyle = "rgba(255,255,255,.03)";
      ctx.fillRect(s.x, s.y + 3, s.w, s.h - 3);
    }

    // flag
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillRect(flag.x, flag.y, flag.w, flag.h);
    const fy = flag.y + 10 + (mode === "win" ? -flagRaise : 0);
    ctx.fillStyle = "#4fd6c0";
    ctx.beginPath(); ctx.moveTo(flag.x + flag.w, fy);
    ctx.lineTo(flag.x + flag.w + 42, fy + 13); ctx.lineTo(flag.x + flag.w, fy + 26); ctx.closePath(); ctx.fill();

    // coins
    for (const c of coins) {
      if (c.got) continue;
      if (c.x < cam - 40 || c.x > cam + W + 40) continue;
      const r = 9, sq = Math.abs(Math.cos(c.t)) * .75 + .25;
      const yy = c.y + Math.sin(c.t * .8) * 3;
      ctx.save(); ctx.translate(c.x, yy); ctx.scale(sq, 1);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283);
      ctx.fillStyle = "#ffd166"; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.stroke();
      ctx.restore();
    }

    // enemies
    for (const e of enemies) {
      if (e.x + e.w < cam - 40 || e.x > cam + W + 40) continue;
      if (!e.alive) {
        if (e.squash <= 0) continue;
        ctx.globalAlpha = e.squash;
        ctx.fillStyle = "#ff6b6b";
        ctx.fillRect(e.x, e.y + e.h - 8, e.w, 8);
        ctx.globalAlpha = 1; continue;
      }
      ctx.fillStyle = "#ff6b6b";
      roundRect(e.x, e.y, e.w, e.h, 7); ctx.fill();
      ctx.fillStyle = "#0a0d14";
      const ex = e.vx > 0 ? 6 : 2;
      ctx.fillRect(e.x + ex + 4, e.y + 9, 5, 6);
      ctx.fillRect(e.x + ex + 14, e.y + 9, 5, 6);
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life * 1.6);
      ctx.fillStyle = p.color; ctx.fillRect(p.x - 2.5, p.y - 2.5, 5, 5);
    }
    ctx.globalAlpha = 1;

    // player (the avatar)
    if (!player.dead || mode === "play") {
      const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
      ctx.save(); ctx.translate(cx, cy);
      if (!player.onGround) ctx.rotate(player.spin);
      const squash = player.onGround && Math.abs(player.vx) > 30 ? 1 + Math.sin(elapsed * 22) * .05 : 1;
      ctx.scale(player.face * squash, 1 / squash);
      ctx.beginPath(); ctx.arc(0, 0, player.w / 2 + 3, 0, 6.283);
      ctx.fillStyle = "rgba(79,214,192,.22)"; ctx.fill();
      if (avatarReady) {
        ctx.save(); ctx.beginPath(); ctx.arc(0, 0, player.w / 2, 0, 6.283); ctx.clip();
        ctx.drawImage(avatar, -player.w / 2, -player.h / 2, player.w, player.h);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(0, 0, player.w / 2, 0, 6.283);
        ctx.fillStyle = "#4fd6c0"; ctx.fill();
      }
      ctx.beginPath(); ctx.arc(0, 0, player.w / 2, 0, 6.283);
      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.stroke();
      ctx.restore();
    }

    ctx.restore();

    if (mode === "win" && flagRaise < 34) flagRaise += 1.2;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // ── screens ───────────────────────────────────────────────────────────────
  function screen(html) { card.innerHTML = html; overlay.classList.add("on"); }
  function hideScreen() { overlay.classList.remove("on"); }

  function showTitle() {
    mode = "title";
    screen(`
      <h2>Avatar Dash</h2>
      <p>
        Reach the flag at the far right.<br />
        Land on an enemy to squash it — touch one from the side and you lose a life.<br />
        Hold the jump key longer to jump higher.
      </p>
      <div class="row">
        <button class="btn" id="go">Start</button>
      </div>`);
    document.getElementById("go").onclick = () => start(true);
  }
  function showWin() {
    screen(`
      <h2>Flag reached</h2>
      <p>
        Coins <b>${got}/${coins.length}</b> &nbsp;·&nbsp; Time <b>${elapsed.toFixed(1)}s</b> &nbsp;·&nbsp;
        Score <b>${score}</b>
      </p>
      <div class="row">
        <button class="btn" id="again">Play again</button>
      </div>`);
    document.getElementById("again").onclick = () => start(true);
  }
  function showOver() {
    mode = "dead";
    screen(`
      <h2>Out of lives</h2>
      <p>Coins <b>${got}</b> &nbsp;·&nbsp; Score <b>${score}</b> &nbsp;·&nbsp; Time <b>${elapsed.toFixed(1)}s</b></p>
      <div class="row"><button class="btn" id="retry">Try again</button></div>`);
    document.getElementById("retry").onclick = () => start(true);
  }
  function pause() {
    mode = "pause";
    screen(`<h2>Paused</h2><p>Press <kbd>P</kbd> to continue.</p>
            <div class="row"><button class="btn" id="res">Resume</button>
            <button class="btn ghost" id="rs">Restart</button></div>`);
    document.getElementById("res").onclick = resume;
    document.getElementById("rs").onclick = () => start(true);
  }
  function resume() { hideScreen(); mode = "play"; }
  function start(full) { reset(full); hideScreen(); mode = "play"; }

  // ── loop ──────────────────────────────────────────────────────────────────
  let last = performance.now(), acc = 0;
  function frame(now) {
    let delta = (now - last) / 1000; last = now;
    if (delta > 0.25) delta = 0.25;
    acc += delta;
    while (acc >= DT) { step(DT); acc -= DT; }
    draw();
    requestAnimationFrame(frame);
  }

  reset(true);
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
